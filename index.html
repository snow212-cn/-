<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>暴走英雄坛 · 真元方案优化助手</title>
    <!-- Fallback for CSS if JS import fails -->
    <link rel="stylesheet" href="./index.css" />
    <!-- Tailwind CDN for robust styling support -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              game: {
                dark: 'var(--bg-main)',
                panel: 'var(--bg-panel)',
                accent: 'var(--col-accent)',
                success: 'var(--col-success)',
                warning: 'var(--col-warning)',
                danger: 'var(--col-danger)',
                text: 'var(--col-text-main)',
                muted: 'var(--col-text-muted)',
                highlight: 'var(--col-highlight)',
                border: 'var(--col-border)'
              }
            }
          }
        }
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "vite": "https://esm.sh/vite@^7.2.7",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
      }
    }
    </script>
  </head>
  <body class="theme-dark">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
